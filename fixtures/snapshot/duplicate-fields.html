<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Duplicate Fields Fixture</title>
</head>
<body>
  <section aria-labelledby="contact-heading">
    <h2 id="contact-heading">İletişim formu</h2>
    <label for="contact-email">E-posta</label>
    <input id="contact-email" name="contactEmail" type="text"/>
    <label for="contact-id">Kimlik belgesi</label>
    <input id="contact-id" name="idDoc" type="file"/>
  </section>

  <section aria-labelledby="billing-heading">
    <h2 id="billing-heading">Fatura bilgileri</h2>
    <label for="billing-email">E-posta</label>
    <input id="billing-email" name="billingEmail" type="text"/>
    <label for="resume">Özgeçmiş</label>
    <input id="resume" name="resume" type="file"/>
  </section>

  <section aria-labelledby="job-heading">
    <h2 id="job-heading">İş başvurusu</h2>
    <label for="job-resume">Özgeçmiş</label>
    <input id="job-resume" name="jobResume" type="file"/>
  </section>
</body>
</html>
