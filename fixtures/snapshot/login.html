<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Snapshot Fixture Login</title>
</head>
<body>
  <nav aria-label="Main">
    <a href="#home" id="nav-home">Home</a>
    <a href="#settings" id="nav-settings" role="menuitem">Settings</a>
    <!-- Icon font glyph must not pollute role name (Playwright getByRole exact). -->
    <a href="#reports" id="nav-reports">
      <span class="material-icons" aria-hidden="true">assessment</span>
      Reports
    </a>
    <!-- Real U+F0E0 PUA (automationexercise-style) — raw name kept on locator; UI shows cleaned -->
    <a href="/contact_us" id="nav-contact"><span class="icon">&#xF0E0;</span> Contact us</a>
    <!-- Second normalized "Contact us" for AMBIGUOUS coverage when hrefPath omitted -->
    <a href="/contact_us_alt" id="nav-contact-alt"><span class="icon">&#xF0E0;</span> Contact us</a>
  </nav>
  <label for="upload">Attachment</label>
  <input id="upload" name="upload" type="file" data-testid="upload-input"/>
  <h1>Fixture Login</h1>
  <label for="name">Name</label>
  <input id="name" name="name" type="text" aria-label="Name" data-testid="name-input"/>
  <label for="secret">Secret</label>
  <input id="secret" name="secret" type="password" aria-label="Secret" data-testid="secret-input"/>
  <button type="button" id="submit">Submit</button>
  <!-- Duplicate accessible name for AMBIGUOUS_LOCATOR coverage — must not be clicked via silent first() -->
  <button type="button" id="submit-alt">Submit</button>
  <!-- Accessible name tracks textContent so fill→click can assert result change in real browser -->
  <p id="result" role="status">Idle</p>
  <script>
    document.getElementById('submit').addEventListener('click', function () {
      var name = document.getElementById('name').value || '';
      document.getElementById('result').textContent = 'Hello ' + name;
    });
  </script>
</body>
</html>
